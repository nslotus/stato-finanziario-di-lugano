# Runs every check of npm run verify on each push and pull request: source fingerprints, citations, sums, ranks,
# printed values (read with pdf.js and again with pypdf), translations, a full rebuild from the archived sources and the
# generated docs; then npm run verify:selftest, which plants known errors and requires the checks to catch them. No
# keys, no network beyond installing the locked dependencies (npm by lockfile, pypdf by hash). Actions are pinned.
name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: pypdf for check 15, by hash, in an environment outside the repository
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --require-hashes --only-binary=:all: -r requirements-verify.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: npm run typecheck
      - run: npm run verify
      - run: npm run verify:selftest
      - name: The committed files are the ones the build produces
        run: git diff --exit-code
